version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    gofumpt:
      # v2 renamed extra-rules; the old key emitted a deprecation warning on
      # every run once golangci-lint v2 actually started running.
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - hrllk/graphkeeper

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck

run:
  timeout: 5m
