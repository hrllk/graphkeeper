version: "2"

formatters:
  enable:
    # gofumpt is deliberately absent. In golangci-lint v2.13.2 its `run` check
    # reports files that `golangci-lint fmt` itself has nothing to change in:
    # measured 2026-08-28, 41 of 110 flagged files had a zero-line fmt diff, and
    # applying fmt to all 73 files it did want to change still left 93 findings.
    # A formatter whose own output does not satisfy its own check cannot gate
    # anything. The repo is gofmt-clean (0 findings), which is the bar we keep.
    - goimports

  settings:
    goimports:
      local-prefixes:
        - hrllk/graphkeeper

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck

run:
  timeout: 5m
